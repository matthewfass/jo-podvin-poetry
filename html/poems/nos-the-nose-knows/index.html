          <h1>no's the nose knows</h1>
          <div class="poem__manifest"><button class="manifest-button" type="button" data-manifest aria-expanded="false"><span class="manifest-button__dots" aria-hidden="true">✦ ✦ ✦</span><span>manifest poem</span></button></div>
          <div class="poem__veil" aria-hidden="true"></div>
          <div class="poem__body" data-poem-body>
            <p class="verse"><span>no beginning, so no end</span><span>no horizon, so no place</span></p>
            <p class="verse"><span>the wind that blows off zero</span><span>smells of waterfalls and space</span></p>
