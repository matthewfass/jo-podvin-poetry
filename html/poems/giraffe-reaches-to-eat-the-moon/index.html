          <div class="poem__manifest"><button class="manifest-button" type="button" data-manifest aria-expanded="false"><span class="manifest-button__dots" aria-hidden="true">✦ ✦ ✦</span><span>manifest poem</span></button></div>

            <p class="verse"><span class="indent-2">giraffe reaches</span><span class="indent-2">to eat the moon</span></p>
            <p class="verse"><span class="indent-2">the distance</span><span class="indent-2">is just seven bones</span></p>
